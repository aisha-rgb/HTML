<!--

Etiquetas genéricas

Existen dos qwe nos ayudan a crear elementos de tipo bloque y línea.

div Se usa como un contenedor de división y semánticamente no significa nada. Sirve como contenedor de bloque.

span Es un contenedor de tipo línea, se suele usar para encerrar palabras o pequeños textos. Semánticamente. No significan nada.

Contenedor de bloque - ocupabn todo el amcho disponible y darán un salto de línea.

Contenedor de línea - va a ocupar el ancho de su contenido y no da salto de línea.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas genéricas </title>
</head>
<body>
   
    <h1>Etiquetas genéricas</h1>

    <div>
        Este es un <span style="color: red">elemento</span> de bloque!
    </div>

    <div>
        Este es otro elemento de bloque! <span>Y este es otro elemento de línea! </span>
    </div>
</body>
</html>
