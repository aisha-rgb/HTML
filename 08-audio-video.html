<!--

Audio y video

Estas etiquetas nos permiten insertar contenido multimedia.

<audio>...<audio>
<video>...<video>

Parámetros

- controls muestra los controles de las etiquetas
- autoplay reproduce automáticamente
- loop repite el contenido en bucle
- muted no reproduce el audio

Elemento source

Dentro de las etiquetas de <audio> y <video> se define la etiqueta <source /> y a esta etiqueta le pasamos el parámetro "src" que recibe como valor la ubicación del contenido-


-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya me dio miedo el profe Yatziel </title>
</head>
<body>
    
</body>
</html>

<h1> Audio y video</h1>



<h2> Contenido de audio</h2>
<audio controls autoplay muted>
    <source src="multimedia/take-over.mp3" />
</audio>


<h2>Contenido de video</h2>
<video controls autoplay muted loop width="1024px" height="auto">
    <source src="multimedia/futaba-sakura.mp4" />
    Tu navegador no es compatible  don el cointenido multimedia. Cambia a un navegador más moderno.
</video>
