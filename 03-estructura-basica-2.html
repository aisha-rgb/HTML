<! --

Para crear la estructura básica podemos usar Emmet.

Emmet es una herramienta de autocompletado integrada en VSC

El shortcut para escribir la estructura: !

Atributos

lang Determina el idioma en el que esta escrito el documento.

charset Determina el conjunto de caracteres que se usa en el documento.


Neta viewport Permite que nuestro documento se vea correctamente en dispositivos móviles. Siempre debe de estar.

Title Define el titulo del documento. Este título si es visible para el usuario y se ubica en las éstañas del navegador.

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ya me dio miedo el profe Yatziel </title>
</head>
<body>
    
</body>
</html>
