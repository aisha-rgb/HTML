<!--

Listas

Nos ayudan a estructurar información ordenada y no ordenada.

Ordenadas llevan numeración y la sintaxis es:

<ol>...</ol>

No ordenadas llevan bullets o viñetas y la sintaxis es:

<ul>...</ul>

Para los elemntos delista se usa la sintaxis:

<li>...</li>

Existe el atributo "type" que permite cambiar el tipo de numeración y bullet de 
una lista.

1 Tipo número
a/A Tipo alfabeto
i/I Tipo romano


Para las listas no ordenadas los valores son;

Bullet balas o puntitos (default)
circle circulos
square cuadros  



-->
